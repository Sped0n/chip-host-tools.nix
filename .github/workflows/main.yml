name: main

on:
  push:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/main.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: &build-matrix
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: &nix-extra-conf |
            experimental-features = nix-command flakes
            trusted-users = runner
            fallback = true
            builders-use-substitutes = true
            connect-timeout = 5
            http-connections = 64
            max-substitution-jobs = 64

      - name: Restore caches
        id: nix-cache-restore
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-store-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-store-check-${{ runner.os }}-${{ runner.arch }}-

      - name: Run flake check
        run: nix flake check -L --keep-going

      - name: Save caches
        if: ${{ always() && steps.nix-cache-restore.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache-restore.outputs.primary-key }}
          gc-max-store-size-linux: 500M
          gc-max-store-size-macos: 500M
          purge: true
          purge-prefixes: nix-store-check-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

  build:
    name: build ${{ matrix.package.name }} (${{ matrix.target.system }})
    needs: flake-check
    runs-on: ${{ matrix.target.runner }}
    env:
      CCACHE_DIR: /nix/var/cache/ccache
      CCACHE_MAX_SIZE: 200M
    strategy:
      fail-fast: false
      matrix:
        target: *build-matrix
        package:
          - name: chip-host-tools_1_4_0_0
            version: 1.4.0.0
          - name: chip-host-tools_1_4_2_0
            version: 1.4.2.0
          - name: chip-host-tools_1_5_0_1
            version: 1.5.0.1
          - name: chip-host-tools_1_5_1_0
            version: 1.5.1.0
          - name: chip-host-tools_1_6_0_0
            version: 1.6.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: *nix-extra-conf

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-${{ hashFiles(format('packages/chip-host-tools/{0}/**', matrix.package.version), 'packages/chip-host-tools/base.nix', 'packages/zap-cli-bin/**/*.nix', 'flake.nix', 'flake.lock') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up ccache permissions for restore
        env:
          CCACHE_STAGING_DIR: ${{ runner.temp }}/ccache
        run: |
          set -euo pipefail
          sudo mkdir -m0770 -p "$CCACHE_DIR"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo chown -R --reference=/nix/store "$CCACHE_DIR"
          else
            nix shell --inputs-from . nixpkgs#coreutils -c sudo chown -R --reference=/nix/store "$CCACHE_DIR"
          fi
          sudo chmod -R 0777 "$CCACHE_DIR"
          if [ -d "$CCACHE_STAGING_DIR" ]; then
            sudo cp -a "$CCACHE_STAGING_DIR"/. "$CCACHE_DIR"/
            sudo chmod -R 0777 "$CCACHE_DIR"
          fi

      - name: Restore caches
        id: nix-cache-restore
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-store-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-${{ hashFiles(format('packages/chip-host-tools/{0}/**', matrix.package.version), 'packages/chip-host-tools/base.nix', 'packages/zap-cli-bin/**/*.nix', 'flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-store-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-
            nix-store-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools
        run: nix profile add --inputs-from . nixpkgs#ccache

      - name: Add Nix profile binaries to PATH
        run: echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Reset ccache stats
        run: |
          set -euo pipefail
          sudo --preserve-env=CCACHE_DIR "$(command -v ccache)" -z

      - name: Build and push packages
        env:
          NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          signing_key_file="$RUNNER_TEMP/nix-cache-signing-key"
          secret_key_file="$RUNNER_TEMP/nix-cache-secret-access-key"

          cleanup() {
            rm -f "$signing_key_file" "$secret_key_file"
          }
          trap cleanup EXIT

          printf '%s' "$NIX_CACHE_SIGNING_KEY" > "$signing_key_file"
          chmod 600 "$signing_key_file"

          printf '%s' "$NIX_CACHE_SECRET_ACCESS_KEY" > "$secret_key_file"
          chmod 600 "$secret_key_file"

          nix profile add github:Sped0n/nix-cache-push

          nix-cache-push config set endpoint nix-cache.sped0n.com
          nix-cache-push config set bucket nix-cache
          nix-cache-push config set region us-east-1
          nix-cache-push config set accessKeyId writer
          nix-cache-push config set signingKeyPath "$signing_key_file"
          nix-cache-push config set secretKeyPath "$secret_key_file"

          echo "::group::Build ${{ matrix.package.name }}"
          paths="$({
            nix build -L --print-out-paths --cores 2 --max-jobs 1 --option extra-sandbox-paths "$CCACHE_DIR" \
              ".#packages.${{ matrix.target.system }}.${{ matrix.package.name }}"
          } | sort -u)"
          printf '%s\n' "$paths"
          echo "::endgroup::"

          echo "::group::Push ${{ matrix.package.name }}"
          printf '%s\n' "$paths" | nix-cache-push
          echo "::endgroup::"

      - name: Show ccache stats
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sudo --preserve-env=CCACHE_DIR,CCACHE_MAX_SIZE "$(command -v ccache)" -M "$CCACHE_MAX_SIZE"
          sudo --preserve-env=CCACHE_DIR "$(command -v ccache)" -c
          sudo --preserve-env=CCACHE_DIR "$(command -v ccache)" -svv

      - name: Set up ccache permissions for save
        if: ${{ always() }}
        env:
          CCACHE_STAGING_DIR: ${{ runner.temp }}/ccache
        run: |
          set -euo pipefail
          rm -rf "$CCACHE_STAGING_DIR"
          mkdir -p "$CCACHE_STAGING_DIR"
          sudo mkdir -m0770 -p "$CCACHE_DIR"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo chown -R --reference=/nix/store "$CCACHE_DIR"
          else
            nix shell --inputs-from . nixpkgs#coreutils -c sudo chown -R --reference=/nix/store "$CCACHE_DIR"
          fi
          sudo cp -a "$CCACHE_DIR"/. "$CCACHE_STAGING_DIR"/
          sudo rm -rf "$CCACHE_STAGING_DIR"/tmp "$CCACHE_STAGING_DIR"/lock
          sudo chown -R "$USER":"$(id -gn)" "$CCACHE_STAGING_DIR"
          chmod -R u+rwX,go-rwx "$CCACHE_STAGING_DIR"

      - name: Save ccache
        if: ${{ always() && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-${{ hashFiles(format('packages/chip-host-tools/{0}/**', matrix.package.version), 'packages/chip-host-tools/base.nix', 'packages/zap-cli-bin/**/*.nix', 'flake.nix', 'flake.lock') }}

      - name: Remove ccache before Nix cache save
        if: ${{ always() && steps.nix-cache-restore.outputs.hit-primary-key != 'true' }}
        run: sudo rm -rf "$CCACHE_DIR"

      - name: Save caches
        if: ${{ always() && steps.nix-cache-restore.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache-restore.outputs.primary-key }}
          gc-max-store-size-linux: 4G
          gc-max-store-size-macos: 4G
          purge: true
          purge-prefixes: nix-store-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package.name }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
